<script type="text/html" data-help-name="wait for flag">
    <p>Define o compartilhamento de volumes entre o computador hospedeiro e o docker.</p>
    <h3>Entradas</h3>
    <dl class="message-properties">
        <dt>Formulário manual</dt>
        <dd>O desenvolvedor necessita informar o volume do computador hospedeiro e o volume equivalente no container.</dd>
        <dd>&nbsp;</dd>
        <dd>Este nó equivale ao comando<br><code>docker run<br>-v my_volume:/path/in/container<br>...</code></dd>
    </dl>
</script>

<script type="text/html" data-template-name="wait for flag">
    <div class="form-row">
        <label for="node-input-flag">Flag</label>
        <input type="input" id="node-input-flag" placeholder="Waiting for connections">
        <div id="node-input-flag-help" class="nr-form"></div>
    </div>

    <div class="form-row">
        <label for="node-input-target">Target</label>
        <input type="text" id="node-input-target" placeholder="30s">
        <input type="hidden" id="node-input-targetType">
    </div>
</script>

<script type="text/javascript">
    (() => {
        const node = this;
        const registerType = "wait for flag";
        const paletteLabel = "flag";
        const category = "chaos";
        const icon = "font-awesome/fa-bug";
        const componentColor = "#aaaaaa";
        const inputs = 0;
        const outputs = 1;

        node.containerSelector = "#container";
        node.containerPartner  = getRegexLinuxRelativeDirPath();
        node.containerHelp     = "Caminho de pasta linux, dentro do container";

        node.localSelector = "#local";
        node.localPartner  = getRegexLinuxRelativePathSafe();
        node.localHelp     = "Caminho de pasta linux, relativo ao local onde o projeto roda";

        RED.nodes.registerType(registerType,{
            category: category,
            color: componentColor,
            defaults: {
                container: { value: "", required: true },
                local: { value: "", required: true }
            },
            inputs: inputs,
            outputs: outputs,
            outputLabels: function(index) {
                return "The next step: ***";
            },
            icon: icon,
            label: function() {
                return paletteLabel;
            },
            oneditsave: function(){
                const $ti = $("#node-input-target");
                this.target     = $ti.typedInput("value");
                this.targetType = $ti.typedInput("type");

                // node.subnet   = $(node.subnetSelector).val();
                // node.gateway  = $(node.gatewaySelector).val();
            },
            oneditprepare: function() {
                const $ti = $("#node-input-target").typedInput({
                    types: [
                        {
                            value: "time",
                            label: "wait time",
                            icon: "fa fa-clock-o",
                            hasValue: true,
                            validate: (v) => /^[0-9]+ms|s/.test(v)
                        }
                    ],
                    // (Opcional) vincule o field do tipo para o Node-RED persistir junto
                    typeField: $("#node-input-targetType")
                });

                // Semeia com os valores atuais da instância
                $ti.typedInput("type",  this.targetType || "msg");
                $ti.typedInput("value", this.target     || "");

                // validateField(node.containerSelector, node.containerPartner, node.containerHelp);
                // validateField(node.localSelector, node.localPartner, node.localHelp);

                // $(node.containerSelector).val(node.container);
                // $(node.localSelector).val(node.local);
            }
        });
    })();
</script>
